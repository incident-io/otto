name: Go test and lint

on:
  pull_request:
    branches: 'master'

jobs:
  go-test-lint:
    strategy:
      matrix:
        go: [1.27]
        golangcli: [v2.14.0]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Validate go mod / generate
        run: |
          go mod tidy
          # Pin stringer: @latest pulls an x/tools that requires a newer Go,
          # forcing a toolchain switch and reformatting the generated files.
          go install golang.org/x/tools/cmd/stringer@v0.29.0
          go generate ./...
          git --no-pager diff && [[ 0 -eq $(git status --porcelain | wc -l) ]]

      - name: Go Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ matrix.golangcli }}
          # Code written before golangci-lint v2 isn't clean under its
          # newer checks, so only lint what each PR changes.
          only-new-issues: true

      - name: Go Build
        run: go build ./...

      - name: Go Test
        run: go test -race -v ./...
